<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AETHER OS</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #06070b;
      --card-bg: rgba(18, 22, 34, 0.55);
      --card-border: rgba(255, 255, 255, 0.09);
      --accent: #2997ff;
      --green: #30d158;
      --red: #ff453a;
      --text: #f5f5f7;
      --subtext: #86868b;
      --happ-active: #6366f1;
    }
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      user-select: none; 
      -webkit-tap-highlight-color: transparent; 
    }
    
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      padding: 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
      overflow-x: hidden;
    }

    /* Космический фон (Canvas) */
    #space-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    .ui-layer {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: calc(100vh - 32px);
    }

    /* Эффект Liquid Glass */
    .glass {
      background: var(--card-bg);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.45);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
    }
    .brand { 
      display: flex; 
      align-items: center; 
      gap: 10px; 
      font-weight: 700; 
      font-size: 16px; 
      letter-spacing: 0.5px; 
    }
    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(255, 69, 58, 0.15);
      color: var(--red);
      transition: all 0.3s ease;
    }

    /* Вкладки */
    .tab-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      padding: 4px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .tab-btn {
      padding: 10px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--subtext);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .tab-btn.active {
      color: #fff;
      background: rgba(255, 255, 255, 0.14);
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }

    .tab-content { 
      display: none; 
      flex-direction: column; 
      gap: 14px; 
    }
    .tab-content.active { 
      display: flex; 
    }

    /* Виджеты телеметрии */
    .grid { 
      display: grid; 
      grid-template-columns: repeat(3, 1fr); 
      gap: 10px; 
    }
    .telemetry-card {
      padding: 16px 10px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .telemetry-val { 
      font-size: 20px; 
      font-weight: 700; 
    }
    .telemetry-label { 
      font-size: 11px; 
      color: var(--subtext); 
      text-transform: uppercase; 
    }
    .telemetry-sub { 
      font-size: 10px; 
      color: var(--accent); 
    }

    .section-title { 
      font-size: 12px; 
      font-weight: 600; 
      color: var(--subtext); 
      margin: 6px 4px 2px; 
      text-transform: uppercase; 
      letter-spacing: 0.5px; 
    }
    .btn-grid { 
      display: grid; 
      grid-template-columns: repeat(2, 1fr); 
      gap: 10px; 
    }
    .btn {
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.15s;
    }
    .btn:active { 
      transform: scale(0.95); 
      background: rgba(255, 255, 255, 0.08); 
    }
    .btn-red { 
      color: var(--red); 
    }

    /* Модуль Happ */
    .happ-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      min-height: 380px;
      gap: 28px;
    }
    .happ-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .happ-status-label {
      font-size: 13px;
      color: var(--subtext);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .happ-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--subtext);
      transition: background 0.3s;
    }

    .happ-switch-btn {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.08), rgba(0,0,0,0.6));
      box-shadow: 0 10px 40px rgba(0,0,0,0.5), inset 0 1px 2px rgba(255,255,255,0.2);
    }
    .happ-switch-btn:active {
      transform: scale(0.92);
    }
    .happ-switch-btn.active {
      border-color: rgba(99, 102, 241, 0.6);
      background: radial-gradient(circle at 35% 35%, rgba(99, 102, 241, 0.35), rgba(15, 17, 35, 0.8));
      box-shadow: 0 0 50px rgba(99, 102, 241, 0.45), inset 0 1px 4px rgba(255,255,255,0.4);
    }

    .happ-power-icon {
      width: 44px;
      height: 44px;
      stroke: var(--subtext);
      stroke-width: 2.2;
      fill: none;
      transition: all 0.3s ease;
    }
    .happ-switch-btn.active .happ-power-icon {
      stroke: #fff;
      filter: drop-shadow(0 0 10px rgba(99, 102, 241, 0.8));
    }
    .happ-state-text {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--subtext);
      transition: color 0.3s;
    }
    .happ-switch-btn.active .happ-state-text {
      color: #fff;
    }

    /* Подпись by smash в Minecraft Rus стиле */
    .footer-author {
      margin-top: auto;
      text-align: center;
      padding: 16px 0 6px;
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.35);
    }
  </style>
</head>
<body>

  <!-- Задний космический план -->
  <canvas id="space-canvas"></canvas>

  <div class="ui-layer">
    <!-- Шапка приложения -->
    <div class="header glass">
      <div class="brand">
        <span>AETHER</span>
      </div>
      <div id="pc-status" class="badge">ПОДКЛЮЧЕНИЕ...</div>
    </div>

    <!-- Вкладки управления -->
    <div class="tab-bar">
      <div id="tab-btn-system" class="tab-btn active" onclick="switchTab('system')">Система</div>
      <div id="tab-btn-happ" class="tab-btn" onclick="switchTab('happ')">Happ</div>
    </div>

    <!-- ВКЛАДКА: СИСТЕМА -->
    <div id="tab-system" class="tab-content active">
      <div class="grid">
        <div class="telemetry-card glass">
          <div class="telemetry-label">CPU</div>
          <div id="cpu-val" class="telemetry-val">0%</div>
          <div class="telemetry-sub">Core</div>
        </div>
        <div class="telemetry-card glass">
          <div class="telemetry-label">GPU</div>
          <div id="gpu-val" class="telemetry-val">0%</div>
          <div id="gpu-temp" class="telemetry-sub">0°C</div>
        </div>
        <div class="telemetry-card glass">
          <div class="telemetry-label">RAM</div>
          <div id="ram-val" class="telemetry-val">0%</div>
          <div id="ram-used" class="telemetry-sub">0 GB</div>
        </div>
      </div>

      <div class="section-title">Питание ПК</div>
      <div class="btn-grid">
        <div class="btn glass" onclick="sendAction('sleep')">🌙 Сон</div>
        <div class="btn glass" onclick="sendAction('restart')">🔄 Рестарт</div>
        <div class="btn glass btn-red" onclick="sendAction('shutdown')" style="grid-column: span 2;">⏻ Выключить ПК</div>
      </div>
    </div>

    <!-- ВКЛАДКА: HAPP -->
    <div id="tab-happ" class="tab-content">
      <div class="happ-container glass">
        <div class="happ-title">Happ Module</div>
        
        <div id="happ-toggle" class="happ-switch-btn" onclick="toggleHapp()">
          <svg class="happ-power-icon" viewBox="0 0 24 24">
            <path d="M12 2v10M18.36 6.64a9 9 0 1 1-12.73 0" stroke-linecap="round"/>
          </svg>
          <span id="happ-text" class="happ-state-text">ВЫКЛ</span>
        </div>

        <div class="happ-status-label">
          <div id="happ-dot" class="happ-dot"></div>
          <span id="happ-desc">Служба не активна</span>
        </div>
      </div>
    </div>

    <!-- Авторская подпись -->
    <div class="footer-author">
      AETHER OS // by smash
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { 
      tg.expand(); 
      tg.ready(); 
    }

    function haptic() {
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
    }

    /* Адрес туннеля Ngrok */
    const PC_URL = "https://pursuant-sixth-salami.ngrok-free.dev";

    /* Переключение вкладок */
    function switchTab(tab) {
      haptic();
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

      if (tab === 'system') {
        document.getElementById('tab-btn-system').classList.add('active');
        document.getElementById('tab-system').classList.add('active');
      } else {
        document.getElementById('tab-btn-happ').classList.add('active');
        document.getElementById('tab-happ').classList.add('active');
      }
    }

    /* Управление модулем Happ */
    let isHappActive = false;
    async function toggleHapp() {
      haptic();
      isHappActive = !isHappActive;
      const btn = document.getElementById('happ-toggle');
      const text = document.getElementById('happ-text');
      const dot = document.getElementById('happ-dot');
      const desc = document.getElementById('happ-desc');

      if (isHappActive) {
        btn.classList.add('active');
        text.innerText = 'ВКЛ';
        dot.style.background = '#6366f1';
        dot.style.boxShadow = '0 0 10px #6366f1';
        desc.innerText = 'Happ активен';
      } else {
        btn.classList.remove('active');
        text.innerText = 'ВЫКЛ';
        dot.style.background = 'var(--subtext)';
        dot.style.boxShadow = 'none';
        desc.innerText = 'Служба не активна';
      }

      try {
        await fetch(`${PC_URL}/action/happ_${isHappActive ? 'on' : 'off'}`, { 
          method: 'POST',
          headers: { "ngrok-skip-browser-warning": "true" }
        });
      } catch (e) {}
    }

    /* Опрос датчиков ПК с пропуском заглушки ngrok */
    async function fetchTelemetry() {
      try {
        const res = await fetch(`${PC_URL}/status`, {
          headers: { "ngrok-skip-browser-warning": "true" }
        });
        if (res.ok) {
          const data = await res.json();
          document.getElementById('cpu-val').innerText = `${data.cpu.percent}%`;
          document.getElementById('gpu-val').innerText = `${data.gpu.percent}%`;
          document.getElementById('gpu-temp').innerText = `${data.gpu.temp}°C`;
          document.getElementById('ram-val').innerText = `${data.ram.percent}%`;
          document.getElementById('ram-used').innerText = `${data.ram.used_gb} GB`;
          
          const status = document.getElementById('pc-status');
          status.innerText = "ОНЛАЙН";
          status.style.color = "var(--green)";
          status.style.background = "rgba(48, 209, 88, 0.15)";
        }
      } catch (e) {
        const status = document.getElementById('pc-status');
        status.innerText = "ОФФЛАЙН";
        status.style.color = "var(--red)";
        status.style.background = "rgba(255, 69, 58, 0.15)";
      }
    }

    /* Отправка команд питания ПК */
    async function sendAction(act) {
      haptic();
      if (confirm(`Выполнить команду: ${act}?`)) {
        try {
          await fetch(`${PC_URL}/action/${act}`, { 
            method: 'POST',
            headers: { "ngrok-skip-browser-warning": "true" }
          });
        } catch (e) {}
      }
    }

    setInterval(fetchTelemetry, 2000);
    fetchTelemetry();

    /* Интерактивный космос: Звезды и Планеты */
    const canvas = document.getElementById('space-canvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const stars = Array.from({ length: 85 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      radius: Math.random() * 1.2 + 0.3,
      alpha: Math.random() * 0.8 + 0.2,
      speed: Math.random() * 0.015 + 0.005
    }));

    const planets = [
      {
        x: canvas.width * 0.82,
        y: canvas.height * 0.18,
        baseX: canvas.width * 0.82,
        baseY: canvas.height * 0.18,
        r: 32,
        rotation: 0,
        rotSpeed: 0.008,
        orbitAngle: 0,
        orbitSpeed: 0.0015,
        color1: '#4338ca',
        color2: '#0f172a',
        glow: 'rgba(99, 102, 241, 0.35)',
        rings: true
      },
      {
        x: canvas.width * 0.16,
        y: canvas.height * 0.74,
        baseX: canvas.width * 0.16,
        baseY: canvas.height * 0.74,
        r: 22,
        rotation: 0,
        rotSpeed: 0.005,
        orbitAngle: Math.PI,
        orbitSpeed: 0.001,
        color1: '#0284c7',
        color2: '#082f49',
        glow: 'rgba(56, 189, 248, 0.25)',
        rings: false
      }
    ];

    function drawSpace() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      stars.forEach(s => {
        s.alpha += Math.sin(Date.now() * s.speed) * 0.01;
        ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0.1, Math.min(1, s.alpha))})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
        ctx.fill();
      });

      planets.forEach(p => {
        p.orbitAngle += p.orbitSpeed;
        p.x = p.baseX + Math.cos(p.orbitAngle) * 14;
        p.y = p.baseY + Math.sin(p.orbitAngle) * 10;
        p.rotation += p.rotSpeed;

        const glowGrad = ctx.createRadialGradient(p.x, p.y, p.r * 0.8, p.x, p.y, p.r * 2.2);
        glowGrad.addColorStop(0, p.glow);
        glowGrad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = glowGrad;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * 2.2, 0, Math.PI * 2);
        ctx.fill();

        ctx.save();
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.clip();

        const grad = ctx.createRadialGradient(
          p.x - p.r * 0.35, p.y - p.r * 0.35, p.r * 0.1,
          p.x, p.y, p.r
        );
        grad.addColorStop(0, p.color1);
        grad.addColorStop(1, p.color2);
        ctx.fillStyle = grad;
        ctx.fill();

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(0.35);
        const bandOffset = (p.rotation * 40) % (p.r * 2);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
        ctx.lineWidth = 3;
        for (let i = -p.r * 2; i < p.r * 2; i += 12) {
          ctx.beginPath();
          ctx.arc(0, i + bandOffset - p.r, p.r * 1.1, 0, Math.PI);
          ctx.stroke();
        }
        ctx.restore();

        const shadowGrad = ctx.createRadialGradient(
          p.x - p.r * 0.4, p.y - p.r * 0.4, p.r * 0.5,
          p.x, p.y, p.r
        );
        shadowGrad.addColorStop(0, 'rgba(0,0,0,0)');
        shadowGrad.addColorStop(1, 'rgba(0,0,0,0.85)');
        ctx.fillStyle = shadowGrad;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        if (p.rings) {
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(0.42);
          ctx.scale(1, 0.28);
          ctx.beginPath();
          ctx.arc(0, 0, p.r * 2.1, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(165, 180, 252, 0.22)';
          ctx.lineWidth = 4;
          ctx.stroke();
          ctx.restore();
        }
      });

      requestAnimationFrame(drawSpace);
    }
    drawSpace();
  </script>
</body>
</html>
