<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#08090C">
<title>AETHER OS</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<!-- ═════════════ КОНФИГУРАЦИЯ (единственное место, которое нужно править) ═════════════ -->
<script>
  window.AETHER_CONFIG = {
    // HTTPS-адрес вашей публикации CloudPub (без слеша в конце), напр. "https://aether-xxxx.cloudpub.ru"
    API_URL: "https://handily-disarming-hamster.cloudpub.ru",
    // Имя бота без @ — нужно для кнопки Wake-on-LAN (она отправляет боту /start wake)
    BOT_USERNAME: "aetherAIapp_bot"
  };
</script>

<style>
  :root{
    --obsidian:#08090C; --graphite:#12141A; --graphite2:#1A1D25;
    --blue:#0A84FF; --emerald:#30D158; --red:#FF453A; --claude:#D97757; --amber:#FFB000;
    --text:#F2F3F5; --muted:#8B909B;
    --pixel:'Press Start 2P', ui-monospace, 'Courier New', monospace;
    --sans:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Inter, system-ui, sans-serif;
  }
  /* Базовые утилиты (не зависят от загрузки Tailwind CDN) */
  .flex{display:flex}.grid{display:grid}.flex-1{flex:1 1 0%}.min-w-0{min-width:0}.items-center{align-items:center}
  .grid-cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .gap-2{gap:.5rem}.gap-3{gap:.75rem}.mt-1{margin-top:.25rem}.mt-2{margin-top:.5rem}.pt-1{padding-top:.25rem}.px-1{padding-left:.25rem;padding-right:.25rem}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--obsidian);color:var(--text);font-family:var(--sans);
    image-rendering:pixelated;text-rendering:geometricPrecision;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
  body{min-height:100vh;min-height:100dvh;overflow-x:hidden;user-select:none;-webkit-user-select:none}
  img{image-rendering:auto}
  #bg{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;image-rendering:pixelated;pointer-events:none}
  #app{position:relative;z-index:1;max-width:480px;margin:0 auto;
    padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 18px);
    display:flex;flex-direction:column;gap:12px}

  /* ── Liquid Glass ── */
  .glass{position:relative;border-radius:20px;border:1px solid rgba(255,255,255,.08);
    background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.022) 48%,rgba(255,255,255,.04));
    backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 22px rgba(255,255,255,.035),inset 0 -14px 26px rgba(0,0,0,.18),0 12px 32px rgba(0,0,0,.4)}
  .glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
    background:linear-gradient(145deg,rgba(255,255,255,.3),rgba(255,255,255,0) 30%,rgba(255,255,255,0) 68%,rgba(217,119,87,.22));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
  .card{padding:12px}
  .card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
  .lbl{font-family:var(--pixel);font-size:8px;color:var(--muted);letter-spacing:.5px}

  /* ── Пружина ── */
  .press{transition:transform .55s cubic-bezier(.34,1.75,.5,1),background-color .2s,opacity .2s,border-color .2s;
    will-change:transform;touch-action:manipulation;cursor:pointer}
  .press.pressed{transform:scale(var(--ps,.94));transition-duration:.09s,.2s,.2s,.2s}
  .press-lg{--ps:.975}
  button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0}
  button[disabled],.is-busy{opacity:.35;pointer-events:none}
  .is-busy{animation:busy 1s steps(2) infinite}
  @keyframes busy{50%{opacity:.7}}

  /* ── Шапка ── */
  .title{font-family:var(--pixel);font-size:17px;letter-spacing:1px;line-height:1.4;
    background:linear-gradient(180deg,#fff 20%,#9DB7D9);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 10px rgba(10,132,255,.35))}
  .kernel{font-family:var(--pixel);font-size:7px;color:var(--muted)}
  .badge{font-family:var(--pixel);font-size:6px;color:#C9CDD6;padding:4px 6px;border-radius:7px;
    background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.09);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.1);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  .badge b{font-weight:400;color:var(--claude)}

  /* ── Статус ── */
  .dot{display:inline-block;width:8px;height:8px;border-radius:2px;background:#555;flex:none}
  .dot.on{background:var(--emerald);box-shadow:0 0 10px var(--emerald)}
  .dot.warn{background:var(--amber);box-shadow:0 0 10px var(--amber);animation:blink 1s steps(2) infinite}
  .dot.off{background:var(--red);box-shadow:0 0 10px var(--red)}
  @keyframes blink{50%{opacity:.35}}
  .conn-t{font-family:var(--pixel);font-size:9px;line-height:1.4}
  .sub{font-size:12px;color:var(--muted);line-height:1.35}

  /* ── Кольца ── */
  .ring-card{padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;transition:opacity .4s}
  .ring-wrap{position:relative;width:100%;max-width:92px;aspect-ratio:1}
  .ring{width:100%;height:100%;display:block}
  .ring .trk{fill:none;stroke:rgba(255,255,255,.07);stroke-width:8;stroke-dasharray:2 3.1}
  .ring .bar{fill:none;stroke:var(--c);stroke-width:8;stroke-linecap:butt;transition:stroke .4s;filter:drop-shadow(0 0 5px var(--cg))}
  .ring-val{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--pixel);font-size:10px}
  .ring-val small{font-size:6px;color:var(--muted);margin-left:1px}
  .ring-name{font-family:var(--pixel);font-size:8px;color:var(--c)}
  .disk-meter{padding:11px 12px;margin-top:8px}
  .disk-head{display:flex;justify-content:space-between;align-items:center;font-family:var(--pixel);font-size:7px;color:var(--muted);margin-bottom:9px}
  .disk-track{height:7px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);overflow:hidden}
  .disk-fill{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--claude));transition:width .45s ease}
  .disk-meta{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:6px}
  .m-rows{width:100%;display:flex;flex-direction:column;gap:3px;min-height:48px}
  .m-row{display:flex;justify-content:space-between;flex-wrap:wrap;gap:0 4px;font-size:11px;line-height:1.35}
  .m-row .k{color:var(--muted)} .m-row .v{font-variant-numeric:tabular-nums} .m-row .v.hot{color:var(--red)}
  body[data-online="false"] .ring-card{opacity:.45}
  body[data-online="false"] .needs-pc{opacity:.4;pointer-events:none}

  /* ── Кнопки/плитки ── */
  .tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px 6px;border-radius:16px;
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
  .tile svg{width:22px;height:22px}
  .tile .tl{font-family:var(--pixel);font-size:7px;text-align:center;line-height:1.4}
  .tile.accent{color:var(--emerald)} .tile.blue{color:var(--blue)} .tile.warm{color:var(--claude)} .tile.red{color:var(--red)}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 8px;border-radius:14px;
    font-family:var(--pixel);font-size:8px;line-height:1.4;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
  .btn svg{width:15px;height:15px}
  .btn.primary{background:linear-gradient(180deg,rgba(10,132,255,.55),rgba(10,132,255,.3));border-color:rgba(10,132,255,.6)}
  .btn.danger{background:linear-gradient(180deg,rgba(255,69,58,.5),rgba(255,69,58,.28));border-color:rgba(255,69,58,.6)}
  .chip{font-family:var(--pixel);font-size:7px;padding:5px 7px;border-radius:7px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:var(--muted)}
  .chip.on{color:var(--emerald);border-color:rgba(48,209,88,.4);background:rgba(48,209,88,.1)}
  .chip.off{color:var(--red);border-color:rgba(255,69,58,.35);background:rgba(255,69,58,.08)}

  /* ── Лаунчер ── */
  .app-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:14px;
    background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06)}
  .app-row+.app-row{margin-top:8px}
  .app-ico{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;font-family:var(--pixel);font-size:11px;
    color:var(--c);background:var(--cs);border:1px solid var(--cb)}
  .app-info{flex:1;min-width:0}
  .app-name{font-size:14px;font-weight:600}
  .app-status{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-top:2px}
  .app-status.run{color:var(--emerald)}
  .app-actions{display:flex;gap:6px;flex:none}
  .ibtn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
  .ibtn svg{width:15px;height:15px}
  .ibtn[data-act=start]{color:var(--emerald)} .ibtn[data-act=stop]{color:var(--red)}
  .ibtn[data-act=restart]{color:var(--blue)} .ibtn[data-act=minimize]{color:var(--claude)}

  /* ── Скриншот ── */
  .shot-box{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:rgba(0,0,0,.35);
    border:1px solid rgba(255,255,255,.06);display:grid;place-items:center}
  .shot-box img{width:100%;height:100%;object-fit:contain;display:block}
  .shot-ph{font-family:var(--pixel);font-size:7px;color:var(--muted);text-align:center;padding:0 16px;line-height:1.9}
  .shot-time{font-size:11px;color:var(--muted)}

  /* ── Футер ── */
  .foot{display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 0 2px}
  .foot-t{font-family:var(--pixel);font-size:8px;color:#8FCBFF;
    text-shadow:0 0 4px rgba(10,132,255,.9),0 0 14px rgba(10,132,255,.6),0 0 26px rgba(10,132,255,.35)}
  .foot-t i{font-style:normal;color:var(--amber);text-shadow:0 0 6px rgba(255,176,0,.9),0 0 16px rgba(255,176,0,.5)}
  .bars{display:flex;gap:3px}
  .bars i{width:4px;height:4px;background:var(--amber);box-shadow:0 0 6px var(--amber);animation:blink 1.2s steps(2) infinite}
  .bars i:nth-child(2){animation-delay:.2s} .bars i:nth-child(3){animation-delay:.4s}
  .bars.r{flex-direction:row-reverse}

  /* ── Action Sheet ── */
  .sheet{position:fixed;inset:0;z-index:50;visibility:hidden;transition:visibility 0s .4s}
  .sheet.open{visibility:visible;transition-delay:0s}
  .sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .3s}
  .sheet.open .sheet-bg{opacity:1}
  .sheet-panel{position:absolute;left:10px;right:10px;max-width:460px;margin:0 auto;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);
    padding:12px;transform:translateY(115%);transition:transform .5s cubic-bezier(.32,1.25,.4,1);background-color:rgba(18,20,26,.55)}
  .sheet.open .sheet-panel{transform:none}
  .sheet-title{font-family:var(--pixel);font-size:9px;text-align:center;padding:6px 0 12px;color:var(--text);line-height:1.5}
  .sheet-item{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:14px;font-size:15px;font-weight:600;
    background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07);text-align:left}
  .sheet-item+.sheet-item{margin-top:8px}
  .sheet-item svg{width:20px;height:20px;flex:none}
  .sheet-p{font-size:13px;color:var(--muted);text-align:center;padding:0 8px 14px;line-height:1.45}

  /* ── Тост ── */
  #toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:80;max-width:min(92vw,440px);
    transform:translate(-50%,-160%);transition:transform .5s cubic-bezier(.32,1.4,.4,1);padding:10px 14px;font-size:13px;line-height:1.4;
    border-radius:14px;background:rgba(24,26,34,.8);border:1px solid rgba(255,255,255,.1);
    backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);box-shadow:0 10px 30px rgba(0,0,0,.5);border-left:3px solid var(--emerald)}
  #toast.show{transform:translate(-50%,0)} #toast.err{border-left-color:var(--red)}

  /* ── Просмотр скриншота ── */
  #viewer{position:fixed;inset:0;z-index:70;background:rgba(8,9,12,.94);display:none;overflow:auto;-webkit-overflow-scrolling:touch}
  #viewer.open{display:block}
  #viewer img{display:block;width:100%;height:auto;margin:0 auto;transition:width .25s;position:relative;top:50%;transform:translateY(-50%)}
  #viewer.zoom img{width:260vw;max-width:none;top:0;transform:none}
  #viewerX{position:fixed!important;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;z-index:2}
  #viewerX svg{width:18px;height:18px}

  /* ── Оверлей настройки ── */
  #setup{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(8,9,12,.85)}
  #setup.open{display:flex}
  #setup .glass{padding:18px;max-width:380px}
  #setup h2{font-family:var(--pixel);font-size:10px;line-height:1.5;color:var(--amber);margin:0 0 12px}
  #setup p{font-size:13px;color:var(--text);line-height:1.5;margin:0}
  #setup code{font-family:ui-monospace,Menlo,monospace;color:#8FCBFF}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body data-online="false">
<canvas id="bg" aria-hidden="true"></canvas>

<main id="app">
  <!-- Шапка -->
  <header class="px-1 pt-1">
    <div class="title" role="heading" aria-level="1">AETHER OS</div>
    <div class="flex items-center gap-2 mt-2">
      <span class="kernel">KERNEL v4.0</span>
      <span class="badge">by <b>smash</b></span>
    </div>
  </header>

  <!-- Статус соединения -->
  <section class="glass card press press-lg" id="connCard" aria-live="polite">
    <div class="flex items-center gap-3">
      <i class="dot warn" id="connDot"></i>
      <div class="flex-1 min-w-0">
        <div class="conn-t" id="connT">ПОДКЛЮЧЕНИЕ…</div>
        <div class="sub mt-1" id="connS">Проверяю связь с ПК</div>
      </div>
      <span class="chip" id="connChip">—</span>
    </div>
  </section>

  <!-- CPU / GPU / RAM -->
  <section class="grid grid-cols-3 gap-2" id="rings" aria-label="Мониторинг"></section>
  <section class="glass disk-meter needs-pc" id="diskMeter" aria-label="Место на диске">
    <div class="disk-head"><span>SSD / HDD · C:</span><span id="diskPercent">—</span></div>
    <div class="disk-track"><div class="disk-fill" id="diskFill"></div></div>
    <div class="disk-meta"><span id="diskUsed">Ожидание метрик</span><span id="diskFree">—</span></div>
  </section>

  <!-- Power Hub -->
  <section class="glass card" aria-label="Power Hub">
    <div class="card-h"><span class="lbl">POWER HUB</span></div>
    <div class="grid grid-cols-2 gap-2">
      <button class="tile accent press" id="tileWake" aria-label="Включить ПК (Wake-on-LAN)"><span data-i="bolt"></span><span class="tl">ВКЛЮЧИТЬ ПК</span></button>
      <button class="tile red press needs-pc" id="tilePower" aria-label="Сон, перезагрузка, выключение"><span data-i="power"></span><span class="tl">ПИТАНИЕ</span></button>
      <button class="tile blue press needs-pc" id="tileLock" aria-label="Блокировка Windows"><span data-i="lock"></span><span class="tl">БЛОКИРОВКА</span></button>
      <button class="tile warm press needs-pc" id="tileDesk" aria-label="Свернуть все окна"><span data-i="desk"></span><span class="tl">РАБ. СТОЛ</span></button>
    </div>
  </section>

  <!-- Launcher -->
  <section class="glass card needs-pc" aria-label="Приложения">
    <div class="card-h"><span class="lbl">LAUNCHER</span></div>
    <div id="apps"></div>
  </section>

  <!-- Happ VPN -->
  <section class="glass card needs-pc" id="vpnCard" aria-label="Happ VPN">
    <div class="card-h"><span class="lbl">HAPP VPN</span><span class="chip" id="vpnChip">…</span></div>
    <div class="grid grid-cols-2 gap-2">
      <button class="btn press" id="vpnOpen"><span data-i="open"></span><span>ОТКРЫТЬ</span></button>
      <button class="btn primary press" id="vpnToggle" disabled><span data-i="shield"></span><span id="vpnToggleT">ПОДКЛЮЧИТЬ</span></button>
    </div>
  </section>

  <!-- Screenshot Preview -->
  <section class="glass card needs-pc" aria-label="Скриншот">
    <div class="card-h">
      <span class="lbl">SCREEN</span>
      <button class="btn press" id="shotBtn" style="padding:8px 10px"><span data-i="refresh"></span><span id="shotBtnT">СНИМОК</span></button>
    </div>
    <div class="shot-box press press-lg" id="shotBox">
      <div class="shot-ph" id="shotPh">НАЖМИТЕ «СНИМОК»,<br>ЧТОБЫ УВИДЕТЬ ЭКРАН ПК</div>
      <img id="shotImg" alt="Экран ПК" hidden>
    </div>
    <div class="shot-time mt-2" id="shotTime"></div>
  </section>

  <!-- Футер -->
  <footer class="foot" aria-label="AETHER OS by smash">
    <span class="bars"><i></i><i></i><i></i></span>
    <span class="foot-t">AETHER OS <i>//</i> by smash</span>
    <span class="bars r"><i></i><i></i><i></i></span>
  </footer>
</main>

<!-- Action Sheet -->
<div class="sheet" id="sheet" aria-hidden="true">
  <div class="sheet-bg" data-close></div>
  <div class="sheet-panel glass" role="dialog" aria-modal="true">
    <div id="sheetMain">
      <div class="sheet-title">ПИТАНИЕ ПК</div>
      <button class="sheet-item press" data-pick="sleep"><span data-i="moon" style="color:var(--blue)"></span>Сон</button>
      <button class="sheet-item press" data-pick="restart"><span data-i="refresh" style="color:var(--amber)"></span>Перезагрузка</button>
      <button class="sheet-item press" data-pick="shutdown"><span data-i="power" style="color:var(--red)"></span>Выключение</button>
      <button class="sheet-item press" data-close style="justify-content:center;margin-top:12px;color:var(--muted)">Отмена</button>
    </div>
    <div id="sheetConfirm" hidden>
      <div class="sheet-title" id="cfTitle"></div>
      <div class="sheet-p" id="cfText"></div>
      <div class="grid grid-cols-2 gap-2">
        <button class="btn press" id="cfBack" style="padding:14px 8px">НАЗАД</button>
        <button class="btn danger press" id="cfGo" style="padding:14px 8px">ПОДТВЕРДИТЬ</button>
      </div>
    </div>
  </div>
</div>

<!-- Просмотр скриншота -->
<div id="viewer"><button id="viewerX" class="glass press" aria-label="Закрыть"><span data-i="x"></span></button><img id="viewerImg" alt="Экран ПК"></div>

<div id="toast" role="status"></div>

<div id="setup"><div class="glass"><h2 id="setupT"></h2><p id="setupP"></p></div></div>

<script>
(() => {
'use strict';

/* ───────────── Конфиг и Telegram ───────────── */
const CFG = window.AETHER_CONFIG || {};
const BASE = String(CFG.API_URL || '').replace(/\/+$/, '');
const tg = window.Telegram && window.Telegram.WebApp;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

try {
  tg.ready(); tg.expand();
  tg.setHeaderColor('#08090C'); tg.setBackgroundColor('#08090C');
  if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
} catch (_) {}

const hap = {
  tap(){ try { tg.HapticFeedback.impactOccurred('light'); } catch (_) {} },
  ok(){ try { tg.HapticFeedback.notificationOccurred('success'); } catch (_) {} },

/* ───────────── API ───────────── */
async function api(path, { method = 'GET', timeout = 8000, blob = false } = {}) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeout);
  try {
    const res = await fetch(BASE + path, {
      method, signal: ctrl.signal, cache: 'no-store',
      headers: { 'Authorization': 'tma ' + (tg ? tg.initData : '') }
    });
    if (!res.ok) {
      let detail = '';
      try { const j = await res.json(); if (j && typeof j.detail === 'string') detail = j.detail; } catch (_) {}
      const err = new Error(detail || ('Ошибка ' + res.status));
      err.status = res.status; err.detail = detail;
      throw err;
    }
    return blob ? await res.blob() : await res.json();
  } catch (e) {
    if (e.name === 'AbortError') { const er = new Error('Таймаут запроса'); er.status = 0; throw er; }
    if (e instanceof TypeError) { const er = new Error('Нет связи с ПК'); er.status = 0; throw er; }
    throw e;
  } finally { clearTimeout(timer); }
}

/* ───────────── Защита от повторов ───────────── */
const busy = new Set();
async function run(key, el, fn, { silent = false } = {}) {
  if (busy.has(key)) return false;
  busy.add(key); if (el) el.classList.add('is-busy');
  try {
    const r = await fn();
    hap.ok();
    if (!silent) toast((r && r.message) || 'Готово');
    return true;
  } catch (e) {
    hap.err(); toast(e.message || 'Ошибка', 'err');
    return false;
  } finally { busy.delete(key); if (el) el.classList.remove('is-busy'); }
}

const R = 40, CIRC = 2 * Math.PI * R;
const METRICS = {

const rings = {};
(function buildRings() {
  const host = $('#rings');

    const card = document.createElement('div');
    card.className = 'glass ring-card press';

       </svg><div class="ring-val"><span><b style="font-weight:400" data-n>--</b><small>%</small></span></div></div>
       <div class="m-rows">${m.rows.map(([k, l]) => `<div class="m-row"><span class="k">${l}</span><span class="v" data-r="${k}">—</span></div>`).join('')}</div>`;
    host.appendChild(card);

function setRing(id, v) {

  r.has = true; r.target = Math.max(0, Math.min(100, v));

}
function setVal(id, key, text, hot = false) {

}
function ringLoop() {
  if (!document.hidden) {
    for (const r of Object.values(rings)) {
      const d = r.target - r.cur;

}

const num = (v, d = 0) => (v == null || isNaN(v)) ? null : Number(v).toFixed(d);

/* ───────────── Real-time WebSocket telemetry ───────────── */
let telemetrySocket = null, reconnectTimer = null, reconnectDelay = 800, wsStopped = false;
function connectTelemetry() {
  if (wsStopped || document.hidden || telemetrySocket?.readyState === WebSocket.CONNECTING || telemetrySocket?.readyState === WebSocket.OPEN) return;
  setConn('connecting');
  const url = new URL(BASE + '/ws'); url.protocol = url.protocol === 'https:' ? 'wss:' : 'ws:';
  url.searchParams.set('initData', tg.initData);
  const ws = new WebSocket(url); telemetrySocket = ws;
  ws.onopen = () => { reconnectDelay = 800; S.fails = 0; S.lat = 0; };
  ws.onmessage = event => {
    try {
      const data = JSON.parse(event.data); S.lat = 0; S.fails = 0;
      applyStats(data); applyDisks(data.disks); setConn('online');
      if (Array.isArray(data.apps)) data.apps.forEach(paintApp);
      if (data.vpn) paintVpn(data.vpn);
    } catch (_) { /* ignore malformed frames; next snapshot will recover */ }
  };
  ws.onerror = () => ws.close();
  ws.onclose = event => {
    if (telemetrySocket === ws) telemetrySocket = null;
    if (event.code === 4401) { setConn('expired', 'Сессия Telegram отклонена'); return; }
    if (event.code === 4403) { setConn('denied'); return; }
    setConn('offline');
    if (!wsStopped && !document.hidden) { clearTimeout(reconnectTimer); reconnectTimer = setTimeout(connectTelemetry, reconnectDelay); reconnectDelay = Math.min(10000, reconnectDelay * 1.7); }
  };
}

/* ───────────── Фон: звёзды и планеты (Canvas, пиксельный) ───────────── */
(function background() {
  const cv = $('#bg'), cx = cv.getContext('2d'); const SC = 3;
  let W = 0, H = 0, stars = [];
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size() {
    W = Math.ceil(innerWidth / SC); H = Math.ceil(innerHeight / SC); cv.width = W; cv.height = H;
    const n = Math.round(W * H / 380);
    stars = Array.from({ length: n }, () => ({ x: Math.random() * W | 0, y: Math.random() * H | 0, p: Math.random() * 6.28, s: .6 + Math.random() * 1.6, b: Math.random() < .12 }));
  }
  function ringArc(x, y, r, from, to, col) {
    cx.save(); cx.translate(x, y); cx.rotate(-.35); cx.strokeStyle = col; cx.lineWidth = Math.max(1, r * .09);
    cx.beginPath(); cx.ellipse(0, 0, r * 1.7, r * .45, 0, from, to); cx.stroke(); cx.restore();
  }
  function planet(x, y, r, c1, c2, ring) {
    if (ring) ringArc(x, y, r, Math.PI, 2 * Math.PI, 'rgba(160,190,255,.22)');
    const g = cx.createRadialGradient(x - r * .4, y - r * .45, r * .1, x, y, r);
    g.addColorStop(0, c1); g.addColorStop(1, c2);
    cx.fillStyle = g; cx.beginPath(); cx.arc(x, y, r, 0, 6.2832); cx.fill();
    if (ring) ringArc(x, y, r, 0, Math.PI, 'rgba(190,210,255,.3)');
  }
  let last = 0;
  function frame(t) {
    if (!document.hidden && t - last > 66) {
      last = t; cx.clearRect(0, 0, W, H);
      const ts = t / 1000;
      for (const s of stars) {
        const a = .25 + .55 * (.5 + .5 * Math.sin(ts * s.s + s.p));
        cx.fillStyle = s.b ? `rgba(255,214,150,${a})` : `rgba(210,225,255,${a * .8})`;
        cx.fillRect(s.x, s.y, 1, 1);
      }
      cx.globalAlpha = .55;
      planet(W * .9 + Math.sin(ts * .05) * 2, H * .16 + Math.cos(ts * .04) * 2, Math.min(W, H) * .24, '#5B7BC0', '#141B33', true);
      planet(W * .1 + Math.cos(ts * .06) * 2, H * .74 + Math.sin(ts * .05) * 2, Math.min(W, H) * .07, '#E58A63', '#3A1A12', false);
      cx.globalAlpha = 1;
    }
    if (!reduce) requestAnimationFrame(frame);
  }
  size(); addEventListener('resize', size);
  requestAnimationFrame(frame);
})();

} else if (!/^https:\/\/[^/]+/i.test(BASE) || /YOUR-NAME/i.test(BASE)) {
  showSetup('НУЖНА НАСТРОЙКА', 'В начале <code>index.html</code> укажите <code>API_URL</code> — HTTPS-адрес вашей публикации CloudPub.');
} else {
  connectTelemetry();
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { wsStopped = true; clearTimeout(reconnectTimer); telemetrySocket?.close(1000, 'hidden'); }
    else { wsStopped = false; connectTelemetry(); }
  });
}
})();
</script>
</body>
</html>
